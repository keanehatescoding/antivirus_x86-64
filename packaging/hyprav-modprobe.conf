# /usr/lib/modprobe.d/hyprav.conf (shipped as packaging/hyprav-modprobe.conf).
#
# Applies the hyprav trusted-reader group to the three IOC /proc
# entries at module load (see #143): av.ko creates
# /proc/kernel_av_{signatures,trusted,protected} as 0640 root:root,
# and the helper below chgrps them to hyprav (members: the desktop
# user running the GUI / unprivileged `avctl save`). The kernel
# cannot resolve group names itself, hence userspace here rather
# than proc_set_group() - see packaging/apply-ioc-group.sh.
#
# /usr/lib (not /etc): distro packages own this file so an admin can
# still override it in /etc/modprobe.d/hyprav.conf, which wins.
# --ignore-install is mandatory: without it the install line recurses
# into itself. The helper never fails the load (it exits 0 even with
# no group/entries - fail-closed root-owned 0640), so a missing
# hyprav group can never turn modprobe into an error.
install av /sbin/modprobe --ignore-install av && /usr/lib/hyprav/apply-ioc-group
